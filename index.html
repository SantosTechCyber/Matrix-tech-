<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Our chat</title>
<style>
  :root {
    --bg: #05070d;
    --panel: #0d1424;
    --panel-2: #111b2f;
    --line: #1e2a44;
    --text: #e6edf8;
    --muted: #7d8aa5;
    --blue: #2563eb;
    --blue-2: #3b82f6;
    --blue-glow: rgba(59, 130, 246, 0.25);
    --err: #f87171;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    color: var(--text);
    background: radial-gradient(circle at top, #0c1a3a 0%, var(--bg) 55%) fixed, var(--bg);
    display: flex;
    flex-direction: column;
  }

  .is-hidden { display: none !important; }

  /* Welcome card: always stacked vertically */
  .setup {
    display: block;
    width: calc(100% - 32px);
    max-width: 380px;
    margin: auto;
    padding: 28px 24px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 18px;
    box-shadow: 0 0 40px var(--blue-glow);
  }
  .setup .hello { font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--blue-2); margin: 0 0 6px; }
  .setup h2 { margin: 0 0 6px; font-size: 24px; font-weight: 600; }
  .setup .lead { margin: 0 0 20px; color: var(--muted); font-size: 14px; line-height: 1.5; }
  .setup input { display: block; width: 100%; margin-bottom: 12px; }
  .setup button { display: block; width: 100%; margin-top: 4px; padding: 13px; font-size: 16px; }

  /* Inputs and buttons */
  input {
    flex: 1;
    min-width: 0;
    padding: 12px 14px;
    background: #070c18;
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 12px;
    font-size: 16px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  input::placeholder { color: var(--muted); }
  input:focus { border-color: var(--blue-2); box-shadow: 0 0 0 3px var(--blue-glow); }

  button {
    padding: 12px 18px;
    border: 0;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--blue), #1d4ed8);
    color: #fff;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    transition: transform 0.1s, filter 0.2s;
  }
  button:hover { filter: brightness(1.1); }
  button:active { transform: scale(0.98); }
  button:disabled { opacity: 0.5; cursor: default; }
  .small {
    padding: 7px 12px;
    font-size: 12px;
    background: transparent;
    color: var(--blue-2);
    border: 1px solid var(--line);
  }
  .attach {
    width: 46px;
    height: 46px;
    padding: 0;
    border-radius: 50%;
    background: var(--panel-2);
    border: 1px solid var(--line);
    color: var(--blue-2);
    font-size: 24px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    cursor: pointer;
  }

  #err { color: var(--err); font-size: 14px; min-height: 18px; margin: 10px 0 0; text-align: center; }
  #status { color: var(--muted); font-size: 13px; text-align: center; padding: 0 0 6px; min-height: 0; }

  /* Chat screen */
  #chat {
    display: flex;
    flex: 1;
    min-height: 0;
    flex-direction: column;
    max-width: 720px;
    width: 100%;
    margin: 0 auto;
    background: rgba(13, 20, 36, 0.6);
    border-left: 1px solid var(--line);
    border-right: 1px solid var(--line);
  }
  header {
    padding: 14px 18px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    background: rgba(5, 7, 13, 0.85);
    border-bottom: 1px solid var(--line);
  }
  header .title { font-weight: 600; font-size: 17px; }
  header .title span { display: block; font-size: 12px; font-weight: 400; color: var(--muted); margin-top: 2px; }

  #msgs {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .empty { margin: auto; text-align: center; color: var(--muted); font-size: 14px; line-height: 1.6; }
  .empty b { display: block; color: var(--text); font-size: 17px; margin-bottom: 4px; }

  .b {
    max-width: 78%;
    padding: 10px 14px;
    border-radius: 16px 16px 16px 4px;
    background: var(--panel-2);
    border: 1px solid var(--line);
    word-wrap: break-word;
    font-size: 15px;
    line-height: 1.45;
    align-self: flex-start;
  }
  .b.mine {
    align-self: flex-end;
    border-radius: 16px 16px 4px 16px;
    background: linear-gradient(135deg, var(--blue), #1d4ed8);
    border-color: transparent;
    color: #fff;
    box-shadow: 0 4px 16px rgba(37, 99, 235, 0.25);
  }
  .who { font-size: 11px; color: var(--blue-2); margin-bottom: 3px; font-weight: 500; }
  .b.mine .who { color: #bfdbfe; text-align: right; }
  .media { display: block; max-width: 100%; max-height: 320px; border-radius: 12px; margin-top: 6px; }
  .body { margin-top: 4px; white-space: pre-wrap; }

  form {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px;
    background: rgba(5, 7, 13, 0.85);
    border-top: 1px solid var(--line);
  }
  form input { border-radius: 999px; padding: 12px 18px; }
  form button { border-radius: 999px; }
</style>
</head>
<body>

<div class="setup is-hidden" id="setup">
  <p class="hello">Hey there</p>
  <h2>Welcome in</h2>
  <p class="lead">A private space for just the two of you. Enter your name and your four secret words to meet here.</p>
  <input id="name" placeholder="Your name">
  <input id="room" placeholder="Secret code (four words)">
  <button onclick="join()">Enter</button>
  <p id="err"></p>
</div>

<div id="chat" class="is-hidden">
  <header>
    <div class="title">Our chat<span>Just the two of you</span></div>
    <button class="small" onclick="localStorage.clear(); location.reload()">Switch</button>
  </header>
  <div id="msgs"></div>
  <div id="status"></div>
  <form onsubmit="send(event)">
    <label class="attach" title="Send a photo or video" aria-label="Send a photo or video">
      +
      <input id="file" type="file" accept="image/*,video/*" hidden>
    </label>
    <input id="text" placeholder="Write something sweet" autocomplete="off">
    <button id="sendBtn">Send</button>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
  const SUPABASE_URL = "https://wixoozjehdypfrhcbpgm.supabase.co";
  const SUPABASE_KEY = "sb_publishable_cUL2LwPX1EpyU930JRxZPA_sZzkOceC";
  const MAX_MEDIA_BYTES = 25 * 1024 * 1024;

  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  let me = localStorage.getItem('name') || '';
  let roomCode = localStorage.getItem('room') || '';
  let messages = [];

  function show(id) { document.getElementById(id).classList.remove('is-hidden'); }
  function hide(id) { document.getElementById(id).classList.add('is-hidden'); }

  function join() {
    const name = document.getElementById('name').value.trim();
    const code = document.getElementById('room').value
      .toLowerCase()
      .replace(/[^\p{L}\p{N}\s]/gu, '')
      .trim()
      .split(/\s+/)
      .join(' ');
    if (!name || code.split(' ').length !== 4) {
      showError('Enter your name and a secret code of exactly four words.');
      return;
    }
    me = name;
    roomCode = code;
    localStorage.setItem('name', name);
    localStorage.setItem('room', code);
    start();
  }

  async function start() {
    hide('setup');
    show('chat');

    const { data, error } = await sb.from('messages')
      .select('*')
      .eq('room', roomCode)
      .order('created_at', { ascending: true })
      .limit(200);
    if (error) { showError('Could not load messages: ' + error.message); return; }
    messages = data || [];
    renderAll();

    // Live updates: new messages (text or media) appear on both phones
    sb.channel('room-' + roomCode)
      .on('postgres_changes', {
        event: 'INSERT', schema: 'public', table: 'messages', filter: 'room=eq.' + roomCode
      }, payload => {
        messages.push(payload.new);
        renderAll();
      })
      .subscribe();
  }

  function renderAll() {
    const box = document.getElementById('msgs');
    box.innerHTML = '';
    if (messages.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'empty';
      empty.innerHTML = '<b>Nothing here yet</b>Say hello or share a photo.';
      box.appendChild(empty);
      return;
    }
    messages.forEach(m => {
      const wrap = document.createElement('div');
      wrap.className = 'b' + (m.name === me ? ' mine' : '');

      const who = document.createElement('div');
      who.className = 'who';
      who.textContent = m.name;
      wrap.appendChild(who);

      if (m.media_url) {
        if (m.media_type === 'video') {
          const v = document.createElement('video');
          v.className = 'media';
          v.controls = true;
          v.playsInline = true;
          v.preload = 'metadata';
          v.src = m.media_url;
          wrap.appendChild(v);
        } else {
          const a = document.createElement('a');
          a.href = m.media_url;
          a.target = '_blank';
          a.rel = 'noopener';
          const img = document.createElement('img');
          img.className = 'media';
          img.loading = 'lazy';
          img.src = m.media_url;
          img.alt = 'Photo';
          a.appendChild(img);
          wrap.appendChild(a);
        }
      }

      if (m.body) {
        const t = document.createElement('div');
        t.className = 'body';
        t.textContent = m.body;
        wrap.appendChild(t);
      }
      box.appendChild(wrap);
    });
    box.scrollTop = box.scrollHeight;
  }

  async function send(e) {
    e.preventDefault();
    const input = document.getElementById('text');
    const body = input.value.trim();
    if (!body) return;
    input.value = '';
    const { error } = await sb.from('messages').insert({ room: roomCode, name: me, body });
    if (error) showError('Message not sent: ' + error.message);
  }

  // Photo and video sharing
  document.getElementById('file').addEventListener('change', async e => {
    const file = e.target.files[0];
    e.target.value = '';
    if (!file) return;

    if (file.size > MAX_MEDIA_BYTES) {
      showError('That file is too large. The limit is 25 MB.');
      return;
    }
    const isVideo = file.type.startsWith('video/');
    const ext = (file.name.split('.').pop() || '').toLowerCase().replace(/[^a-z0-9]/g, '');
    const path = crypto.randomUUID() + (ext ? '.' + ext : '');

    setBusy(true, isVideo ? 'Uploading video...' : 'Uploading photo...');
    try {
      const { error: upErr } = await sb.storage.from('chat-media').upload(path, file, {
        contentType: file.type, upsert: false
      });
      if (upErr) throw upErr;

      const { data } = sb.storage.from('chat-media').getPublicUrl(path);
      const { error: insErr } = await sb.from('messages').insert({
        room: roomCode,
        name: me,
        body: '',
        media_url: data.publicUrl,
        media_type: isVideo ? 'video' : 'image'
      });
      if (insErr) throw insErr;
    } catch (err) {
      showError('Upload failed: ' + err.message);
    } finally {
      setBusy(false, '');
    }
  });

  function setBusy(busy, text) {
    document.getElementById('sendBtn').disabled = busy;
    document.getElementById('status').textContent = text;
  }

  function showError(text) {
    document.getElementById('err').textContent = text;
  }

  if (me && roomCode) start(); else show('setup');
</script>
</body>
  </html>
